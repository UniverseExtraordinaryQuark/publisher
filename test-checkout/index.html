<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tes Checkout (Sandbox)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f6f5f2; margin: 0; color: #222; }
    main { max-width: 440px; margin: 40px auto; padding: 24px; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    .note { background: #fff4d6; border-radius: 8px; padding: 10px 12px; font-size: .9rem; margin-bottom: 16px; }
    label { display: block; font-size: .9rem; margin: 12px 0 4px; }
    select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
    button { width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 8px; background: #6366f1; color: #fff; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #msg { margin-top: 14px; font-size: .95rem; min-height: 1.2em; }
  </style>
</head>
<body>
<main>
  <h1>Tes Checkout (Sandbox)</h1>
  <div class="note">Halaman uji. Tidak ada uang sungguhan. Yang terkirim ke email hanya PDF contoh bertuliskan TEST.</div>

  <form id="f">
    <label for="book">E-book</label>
    <select id="book" required>
      <option value="ebook-before-i-do">Before "I Do"</option>
      <option value="ebook-rahasia-complexity-science">Rahasia: Complexity Science</option>
      <option value="ebook-remote-work-leadership">Remote Work Leadership</option>
      <option value="ebook-remote-work-playbook">Remote Work Playbook</option>
    </select>

    <label for="name">Nama</label>
    <input id="name" type="text" maxlength="60" required autocomplete="name">

    <label for="email">Email (untuk menerima e-book)</label>
    <input id="email" type="email" maxlength="120" required autocomplete="email">

    <button id="btn" type="submit">Bayar (Sandbox)</button>
  </form>
  <p id="msg"></p>
</main>

<!-- GANTI ISI_CLIENT_KEY_SANDBOX dengan Client Key Sandbox dari Midtrans
     (Client Key aman ditaruh di halaman web; Server Key JANGAN pernah). -->
<script src="https://app.sandbox.midtrans.com/snap/snap.js"
        data-client-key="ISI_CLIENT_KEY_SANDBOX"></script>

<script>
  // GANTI dengan Function URL dari Lambda versx-create-order
  const ORDER_URL = "https://3orlhv6gbouzixvtizqja5xykm0qsqbv.lambda-url.ap-southeast-1.on.aws/";

  const f = document.getElementById("f");
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");

  function say(text) { msg.textContent = text; }

  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true;
    say("Menyiapkan pembayaran...");

    try {
      const res = await fetch(ORDER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          bookId: document.getElementById("book").value,
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
        }),
      });
      const data = await res.json();
      if (!res.ok || !data.token) {
        throw new Error(data.error || "Gagal membuat transaksi");
      }

      say("");
      window.snap.pay(data.token, {
        onSuccess: () => say("Pembayaran berhasil. E-book contoh dikirim ke email Anda (cek juga folder spam)."),
        onPending: () => say("Menunggu pembayaran diselesaikan."),
        onError: () => say("Pembayaran gagal. Silakan coba lagi."),
        onClose: () => say("Jendela pembayaran ditutup."),
      });
    } catch (err) {
      say(err.message || "Terjadi kesalahan.");
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
